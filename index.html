<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEAP IPA Soundboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DEAP IPA Soundboard</h1>
    <p>Click a picture to hear the different JamC/JamE productions.</p>
  </header>

  <main>
    <section id="home-page" class="page active">
      <div id="image-grid"></div>
    </section>

    <section id="word-page" class="page">
      <button id="back-button">← Back</button>

      <h2 id="word-title"></h2>
      <img id="large-image" alt="" />

      <div id="ipa-buttons"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
